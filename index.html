function openEditDeguisement(i){const a=db.deguisements.articles[i];pastedImg=a.photo||null;document.body.insertAdjacentHTML("beforeend",`<div id="deguEditOverlay" class="modal-overlay" style="backdrop-filter:blur(6px)"><div class="modal-box" style="max-width:500px;background:linear-gradient(145deg,#1a1333,#120e24);border:0.5px solid rgba(255,107,107,0.3);color:#e2d9f3;padding:0"><div style="padding:20px 24px;border-bottom:0.5px solid #2a2440;display:flex;align-items:center;justify-content:space-between"><div><div style="font-size:11px;color:#6b5fa0;font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px">Déguisements</div><h3 style="margin:0;font-size:20px;font-weight:700;color:#e2d9f3">✏️ Modifier le déguisement</h3></div><button onclick="closeDeguisementEdit()" style="width:32px;height:32px;border-radius:50%;border:none;cursor:pointer;background:rgba(239,68,68,0.15);color:#fca5a5;font-size:16px;font-weight:700">✕</button></div><div style="padding:20px 24px;display:flex;flex-direction:column;gap:14px"><div><label style="font-size:11px;color:#6b5fa0;font-weight:700;text-transform:uppercase;letter-spacing:0.6px;display:block;margin-bottom:6px">Nom du déguisement</label><input id="deguEditName" value="${a.name}" placeholder="Ex: Fée, Pirate, Sorcier..." style="width:100%;padding:10px 14px;background:rgba(255,255,255,0.05);border:0.5px solid #2a2440;border-radius:10px;color:#e2d9f3;font-size:14px;box-sizing:border-box;outline:none" onfocus="this.style.borderColor='#ff6b6b'" onblur="this.style.borderColor='#2a2440'"></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><div><label style="font-size:11px;color:#6b5fa0;font-weight:700;text-transform:uppercase;letter-spacing:0.6px;display:block;margin-bottom:6px">Quantité</label><input id="deguEditQty" type="number" value="${a.qty}" min="0" style="width:100%;padding:10px 14px;background:rgba(255,255,255,0.05);border:0.5px solid #2a2440;border-radius:10px;color:#fca5a5;font-size:22px;font-weight:700;text-align:center;box-sizing:border-box;outline:none" onfocus="this.style.borderColor='#ff6b6b'" onblur="this.style.borderColor='#2a2440'"></div><div><label style="font-size:11px;color:#6b5fa0;font-weight:700;text-transform:uppercase;letter-spacing:0.6px;display:block;margin-bottom:6px">Taille (optionnel)</label><input id="deguEditTaille" value="${a.taille||''}" placeholder="Ex: S, M, 6 ans..." style="width:100%;padding:10px 14px;background:rgba(255,255,255,0.05);border:0.5px solid #2a2440;border-radius:10px;color:#e2d9f3;font-size:14px;box-sizing:border-box;outline:none" onfocus="this.style.borderColor='#ff6b6b'" onblur="this.style.borderColor='#2a2440'"></div></div><div><label style="font-size:11px;color:#6b5fa0;font-weight:700;text-transform:uppercase;letter-spacing:0.6px;display:block;margin-bottom:6px">Photo</label><div id="photoZone" class="photo-zone" style="border:1px dashed #2a2440;border-radius:10px;padding:20px;text-align:center;cursor:pointer;color:#6b5fa0;background:rgba(255,255,255,0.02)">📷 Cliquez, glissez ou Ctrl+V<input type="file" id="ePhoto" accept="image/*" capture="environment" hidden></div><div id="photoPreview"></div></div><div style="display:flex;gap:10px;padding-top:4px"><button onclick="saveDeguisementEdit(${i})" style="flex:1;background:linear-gradient(135deg,#ff6b6b,#ee5a6f);color:#fff;border:none;padding:13px;border-radius:10px;cursor:pointer;font-weight:700;font-size:15px">💾 Enregistrer</button><button onclick="closeDeguisementEdit()" style="flex:1;background:rgba(255,255,255,0.05);color:#8b7fb5;border:0.5px solid #2a2440;padding:13px;border-radius:10px;cursor:pointer;font-weight:600;font-size:15px">Annuler</button></div></div></div></div>`);setTimeout(()=>{if(a.photo){document.getElementById("photoPreview").innerHTML=`<img src="${a.photo}" class="photo-preview">`}},100);initPhotoZone()}
function closeDeguisementEdit(){closeModal("deguEditOverlay");pastedImg=null}
async function saveDeguisementEdit(i){const name=document.getElementById("deguEditName").value,qty=Number(document.getElementById("deguEditQty").value)||0,taille=document.getElementById("deguEditTaille").value;if(!name){showToast('Nom requis','Renseignez le nom','⚠️');return;return}db.deguisements.articles[i].name=name;db.deguisements.articles[i].qty=qty;db.deguisements.articles[i].taille=taille;if(pastedImg)db.deguisements.articles[i].photo=pastedImg&&pastedImg.startsWith('data:')?await processPhotoForStorage(pastedImg):pastedImg;await save();renderDeguisements();closeDeguisementEdit()}
function deleteDeguisementById(id){const i=db.deguisements.articles.findIndex(a=>a.id===id);if(i<0)return;deleteDeguisement(i)}
async function deleteDeguisement(i){const a=db.deguisements.articles[i];confirmDelete(a.name,async()=>{db.deguisements.articles.splice(i,1);await save();renderDeguisements()})}
async function cancelSortieDeguisement(idx){const mouv=db.deguisements.mouvements[idx];if(!mouv||mouv.type!=='SORTIE'){showToast('Impossible','Ce mouvement ne peut pas être annulé','❌');return;return}if(!confirm('🔄 Annuler cette sortie ?\n\nArticle : '+mouv.article+'\nQuantité : '+mouv.qty+'\nSite : '+mouv.site+'\n\n⚠️ La quantité sera remise en stock.'))return;const article=mouv.articleId?db.deguisements.articles.find(a=>a.id===mouv.articleId):db.deguisements.articles.find(a=>a.name===mouv.article);if(!article){showToast('Introuvable','Article non trouvé dans le stock','❌');return;return}article.qty+=mouv.qty;db.deguisements.mouvements.splice(idx,1);await save();showToast('Sortie annulée',mouv.qty+' unité(s) remise(s) en stock','✅');openDeguisementHistory()}
function openDeguisementHistory(){const rows=db.deguisements.mouvements.slice().reverse().map((m,i)=>{const realIdx=db.deguisements.mouvements.length-1-i;const cancelBtn=m.type==='SORTIE'?'<button onclick="cancelSortieDeguisement('+realIdx+')" style="background:#dc3545;padding:6px 12px;border-radius:6px;color:white;border:none;cursor:pointer">❌ Annuler</button>':'';const typeBadge=m.type==='RETOUR'?'<span style="background:#28a745;color:white;padding:2px 8px;border-radius:6px;font-size:11px">🔄 RETOUR</span>':m.type==='ENTREE'?'<span style="background:#17a2b8;color:white;padding:2px 8px;border-radius:6px;font-size:11px">🚚 ENTREE</span>':m.type;const detail=(m.site||'-')+(m.note?' — <em>'+m.note+'</em>':'');return'<tr><td>'+new Date(m.date).toLocaleDateString()+'</td><td>'+typeBadge+'</td><td>'+m.article+'</td><td>'+m.qty+'</td><td>'+detail+'</td><td>'+cancelBtn+'</td></tr>'}).join('');document.getElementById("app").innerHTML='<div style="background:linear-gradient(135deg,#ff6b6b,#ee5a6f);padding:20px;border-radius:20px;margin-bottom:20px"><h3 style="color:white;margin:0">📊 Historique Déguisements</h3></div><button onclick="renderDeguisements()" style="background:linear-gradient(135deg,#ff6b6b,#ee5a6f)">Retour</button><table style="margin-top:20px"><thead><tr><th>Date</th><th>Type</th><th>Déguisement</th><th>Qté</th><th>Site / Remarque</th><th>Actions</th></tr></thead><tbody>'+rows+'</tbody></table>'}
// ============ EXPORT PDF DÉGUISEMENTS AVEC PHOTOS ============
function exportDeguisementsPDF(){
  const {jsPDF}=window.jspdf;const doc=new jsPDF();let yPos=20;
  doc.setFontSize(22);doc.setFont(undefined,'bold');doc.setTextColor(255,107,107);doc.text("🎭 Stock Déguisements",105,yPos,{align:'center'});yPos+=10;
  doc.setFontSize(12);doc.setFont(undefined,'normal');doc.setTextColor(0,0,0);doc.text(`État au ${new Date().toLocaleDateString()}`,105,yPos,{align:'center'});yPos+=5;
  doc.setFontSize(9);doc.text(`Généré le ${new Date().toLocaleDateString()} à ${new Date().toLocaleTimeString()}`,105,yPos,{align:'center'});yPos+=15;
  const totalArticles=db.deguisements.articles.length,totalQty=db.deguisements.articles.reduce((sum,a)=>sum+a.qty,0);
  doc.setFillColor(255,245,245);doc.rect(14,yPos,182,20,'F');doc.setFontSize(11);doc.setFont(undefined,'bold');doc.text(`📊 Total: ${totalArticles} déguisement(s) | ${totalQty} pièce(s)`,20,yPos+7);yPos+=25;
  if(totalArticles===0){doc.setFontSize(14);doc.setTextColor(150,150,150);doc.text('Aucun déguisement',105,yPos+30,{align:'center'});doc.save(`stock_deguisements_${new Date().toISOString().slice(0,10)}.pdf`);showToast('PDF vide','Aucun déguisement dans le stock','⚠️');return}
  for(const degu of db.deguisements.articles){
    if(yPos>240){doc.addPage();yPos=20}
    doc.setDrawColor(255,107,107);doc.setLineWidth(0.5);doc.rect(14,yPos,182,65);
    if(degu.photo){try{doc.addImage(degu.photo,'JPEG',18,yPos+5,50,55)}catch(e){doc.setFontSize(10);doc.setTextColor(150,150,150);doc.text('📷',43,yPos+35)}}else{doc.setFillColor(255,245,245);doc.rect(18,yPos+5,50,55,'F');doc.setFontSize(30);doc.setTextColor(255,107,107);doc.text('🎭',35,yPos+40)}
    doc.setTextColor(0,0,0);doc.setFontSize(14);doc.setFont(undefined,'bold');doc.text(degu.name,75,yPos+15,{maxWidth:115});
    if(degu.taille){doc.setFontSize(11);doc.setFont(undefined,'normal');doc.text(`Taille: ${degu.taille}`,75,yPos+30)}
    doc.setFontSize(16);doc.setFont(undefined,'bold');doc.setTextColor(255,107,107);doc.text(`Quantité: ${degu.qty}`,75,yPos+45);yPos+=70}
  doc.setFontSize(8);doc.setTextColor(100,100,100);doc.text('Document généré par le système de gestion des stocks - Mairie',105,285,{align:'center'});
  doc.save(`stock_deguisements_${new Date().toISOString().slice(0,10)}.pdf`);showToast('PDF Déguisements généré','Fichier téléchargé','📄');
}
// ============ ÉPICERIE ============
function getEpicerieIndexById(id){return db.epicerie.articles.findIndex(a=>a.id===id)}
function renderEpicerie(){
  // 🧹 Nettoyage auto : supprime les articles dont tous les lots sont vides (qty=0 ou batches=[])
  const avant=db.epicerie.articles.length;
  db.epicerie.articles=db.epicerie.articles.filter(a=>{
    a.batches=(a.batches||[]).filter(b=>b.qty>0);
    return a.batches.length>0;
  });
  if(db.epicerie.articles.length!==avant){save();}
  highlightSearchTarget();curEpiceriePage=1;window._epicerieFilter='all';document.getElementById("app").innerHTML=`<div style="background:linear-gradient(135deg,#0d0d1a,#1a1040,#0d0d1a);padding:30px;border-radius:24px;margin-bottom:20px;box-shadow:0 15px 40px rgba(139,92,246,0.3);position:relative;overflow:hidden;border:1px solid rgba(139,92,246,0.2)"><div style="position:absolute;top:-60px;right:-60px;width:220px;height:220px;background:radial-gradient(circle,rgba(139,92,246,0.15),transparent);border-radius:50%"></div><div style="position:absolute;bottom:-40px;left:-40px;width:160px;height:160px;background:radial-gradient(circle,rgba(236,72,153,0.1),transparent);border-radius:50%"></div><div style="position:relative"><div style="display:flex;align-items:center;gap:14px;margin-bottom:8px"><div style="width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,#8b5cf6,#ec4899);display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 0 20px rgba(139,92,246,0.5)">🥫</div><div><h2 style="color:#e2d9f3;margin:0;font-size:28px;font-weight:800;letter-spacing:-0.5px">Épicerie Solidaire</h2><p style="color:#6b5fa0;margin:4px 0 0 0;font-size:13px">Stocks alimentaires · Gestion par lots · Péremptions</p></div></div></div></div><div id="epicerieStatsCards" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:16px"></div><div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap"><button onclick="openAddEpicerie()" style="background:linear-gradient(135deg,#7c3aed,#a78bfa);color:#fff;border:none;padding:10px 18px;border-radius:10px;cursor:pointer;font-weight:700;font-size:13px;box-shadow:0 4px 15px rgba(124,58,237,0.4)">➕ Ajouter</button><button onclick="openEpicerieHistory()" style="background:rgba(139,92,246,0.15);color:#a78bfa;border:1px solid rgba(139,92,246,0.3);padding:10px 18px;border-radius:10px;cursor:pointer;font-weight:600;font-size:13px">📊 Historique</button><button onclick="exportEpiceriePDF()" style="background:rgba(139,92,246,0.15);color:#a78bfa;border:1px solid rgba(139,92,246,0.3);padding:10px 18px;border-radius:10px;cursor:pointer;font-weight:600;font-size:13px">📄 PDF</button><button onclick="changePage(openDashboard);setTimeout(()=>toggleStockMenu(),600)" style="background:rgba(255,255,255,0.05);color:#6b5fa0;border:1px solid rgba(255,255,255,0.1);padding:10px 18px;border-radius:10px;cursor:pointer;font-weight:600;font-size:13px">📦 Modules</button></div><div style="display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap"><input id="epicerieSearch" placeholder="🔍 Rechercher un article..." oninput="filterEpicerieGrid()" style="flex:1;min-width:200px;padding:10px 14px;border-radius:10px;border:1px solid rgba(139,92,246,0.3);font-size:14px;background:#1a1333;color:#e2d9f3"><div style="display:flex;gap:6px"><button id="epf-all" onclick="setEpicerieFilter('all')" style="padding:7px 14px;border-radius:20px;border:1px solid #8b5cf6;background:#8b5cf6;color:white;font-size:12px;font-weight:600;cursor:pointer">Tous</button><button id="epf-urgent" onclick="setEpicerieFilter('urgent')" style="padding:7px 14px;border-radius:20px;border:1px solid rgba(239,68,68,0.5);background:rgba(239,68,68,0.1);color:#fca5a5;font-size:12px;font-weight:600;cursor:pointer">⚠️ Urgents</button><button id="epf-ok" onclick="setEpicerieFilter('ok')" style="padding:7px 14px;border-radius:20px;border:1px solid rgba(34,197,94,0.5);background:rgba(34,197,94,0.1);color:#86efac;font-size:12px;font-weight:600;cursor:pointer">✅ Frais</button></div></div><div class="epicerie-grid" id="epicerieGrid"></div><div id="epiceriePagination" class="pagination"></div>`;renderEpicerieStatsCards();renderEpicerieGrid();}function setEpicerieFilter(f){window._epicerieFilter=f;const btns={all:document.getElementById('epf-all'),urgent:document.getElementById('epf-urgent'),ok:document.getElementById('epf-ok')};if(btns.all){btns.all.style.background=f==='all'?'#8b5cf6':'transparent';btns.all.style.borderColor=f==='all'?'#8b5cf6':'rgba(139,92,246,0.4)';btns.urgent.style.background=f==='urgent'?'rgba(239,68,68,0.3)':'rgba(239,68,68,0.1)';btns.ok.style.background=f==='ok'?'rgba(34,197,94,0.3)':'rgba(34,197,94,0.1)';}filterEpicerieGrid();}function highlightSearchTarget(){if(!window._globalSearchTarget)return;setTimeout(()=>{const all=document.querySelectorAll('h3,td,.cc-name');all.forEach(el=>{if(el.textContent.includes(window._globalSearchTarget)){el.closest('div,tr')?.scrollIntoView({behavior:'smooth',block:'center'});el.style.background='rgba(139,92,246,0.3)';el.style.borderRadius='4px';setTimeout(()=>{el.style.background='';},2000);}});window._globalSearchTarget=null;},400);}function filterEpicerieGrid(){const term=(document.getElementById('epicerieSearch')?.value||'').toLowerCase();const f=window._epicerieFilter||'all';const now=new Date();let list=db.epicerie.articles.filter(a=>a.name.toLowerCase().includes(term));if(f==='urgent')list=list.filter(a=>a.batches.some(b=>{if(!b.expiryDate)return false;const diff=(new Date(b.expiryDate)-now)/(1000*60*60*24);return diff<=7;}));if(f==='ok')list=list.filter(a=>a.batches.every(b=>{if(!b.expiryDate)return true;const diff=(new Date(b.expiryDate)-now)/(1000*60*60*24);return diff>7;}));list.sort((a, b) => {
  const dateA = a.batches.length ? Math.min(...a.batches.filter(b=>b.expiryDate).map(b=>new Date(b.expiryDate))) : Infinity;
  const dateB = b.batches.length ? Math.min(...b.batches.filter(b=>b.expiryDate).map(b=>new Date(b.expiryDate))) : Infinity;

}); renderEpicerieGridWithList(list);}

function showDistribTab(tab){const pt=document.getElementById('panelTransfert'),ps=document.getElementById('panelSortie'),bt=document.getElementById('tabTransfert'),bs=document.getElementById('tabSortie');if(!pt||!ps)return;pt.style.display=tab==='transfert'?'block':'none';ps.style.display=tab==='sortie'?'block':'none';bt.style.background=tab==='transfert'?'rgba(79,172,254,0.3)':'transparent';bt.style.color=tab==='transfert'?'#4facfe':'#94a3b8';bs.style.background=tab==='sortie'?'rgba(239,68,68,0.3)':'transparent';bs.style.color=tab==='sortie'?'#f87171':'#94a3b8';}
function calcInput(val){const exprEl=document.getElementById('calcExpr');const resEl=document.getElementById('calcResult');if(!exprEl||!resEl)return;let expr=exprEl.textContent||'';if(expr.includes('=')){expr='';exprEl.textContent='';resEl.textContent='0';}if(val==='C'){exprEl.textContent='';resEl.textContent='0';return;}if(val==='←'){expr=expr.slice(0,-1);exprEl.textContent=expr;resEl.textContent=expr||'0';return;}if(val==='='){try{const clean=expr.replace(/÷/g,'/').replace(/×/g,'*').replace(/−/g,'-').replace(/%/g,'/100');const result=Function('"use strict";return ('+clean+')')();const formatted=parseFloat(result.toFixed(8)).toLocaleString('fr-FR',{maximumFractionDigits:8});exprEl.textContent=expr+' =';resEl.textContent=formatted;}catch(e){resEl.textContent='Erreur';}return;}expr+=val;exprEl.textContent=expr;try{const clean=expr.replace(/÷/g,'/').replace(/×/g,'*').replace(/−/g,'-').replace(/%/g,'/100');const result=Function('"use strict";return ('+clean+')')();resEl.textContent=parseFloat(result.toFixed(8)).toLocaleString('fr-FR',{maximumFractionDigits:8});}catch(e){resEl.textContent=expr;}}async function saveTransfertInterne(articleId){const fromId=Number(document.getElementById("stFrom").value);const toId=Number(document.getElementById("stTo").value);const qty=Number(document.getElementById("stQtyTransfert").value);const dateVal=document.getElementById("dateTransfert")?.value;const comment=document.getElementById("commentTransfert")?.value||'';if(!fromId||!toId||qty<=0){showToast('Champs manquants','Renseignez tous les champs','⚠️');return;return}if(fromId===toId){showToast('Erreur','Source et destination identiques','⚠️');return;return}const article=db.stocktampon.articles.find(a=>a.id===articleId);const fromStock=article.stocks.find(s=>s.restaurantId===fromId);if(!fromStock){showToast('Introuvable','Stock source introuvable','❌');return;return}const totalAvailable=fromStock.batches.reduce((s,b)=>s+b.qty,0);if(qty>totalAvailable){showToast('Stock insuffisant','Disponible: '+totalAvailable,'❌');return}fromStock.batches.sort((a,b)=>new Date(a.expiryDate||'2099')-new Date(b.expiryDate||'2099'));let remaining=qty;const transferred=[];for(const batch of fromStock.batches){if(remaining<=0)break;const take=Math.min(batch.qty,remaining);batch.qty-=take;remaining-=take;transferred.push({qty:take,expiryDate:batch.expiryDate});}fromStock.batches=fromStock.batches.filter(b=>b.qty>0);let toStock=article.stocks.find(s=>s.restaurantId===toId);if(!toStock){toStock={restaurantId:toId,batches:[]};article.stocks.push(toStock)}transferred.forEach(t=>toStock.batches.push({id:Date.now()+Math.random(),qty:t.qty,expiryDate:t.expiryDate}));const fromResto=db.stocktampon.restaurants.find(r=>r.id===fromId);const toResto=db.stocktampon.restaurants.find(r=>r.id===toId);if(!db.stocktampon.mouvements)db.stocktampon.mouvements=[];const dateOp=dateVal?new Date(dateVal).toISOString():new Date().toISOString();db.stocktampon.mouvements.push({type:'TRANSFERT',article:article.name,qty,from:fromResto.name,to:toResto.name,date:dateOp,comment,role:isGuest()?'Invité':'Admin'});await save();closeStockTamponModal();const dateAff=new Date(dateOp).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});showToast('Transfert effectué',qty+' → '+toResto.name,'🔄');renderStockTampon();}
async function saveSortieDefinitive(articleId){const fromId=Number(document.getElementById("stFromSortie").value);const qty=Number(document.getElementById("stQtySortie").value);const motif=document.getElementById("stMotifSortie").value||'Sortie définitive';const dateVal=document.getElementById("dateSortie")?.value;const comment=document.getElementById("commentSortie")?.value||'';if(!fromId||qty<=0){showToast('Champ manquant','Restaurant et quantité obligatoires','⚠️');return;return}const article=db.stocktampon.articles.find(a=>a.id===articleId);const fromStock=article.stocks.find(s=>s.restaurantId===fromId);if(!fromStock){showToast('Introuvable','Stock non trouvé pour ce restaurant','❌');return;return}const totalAvailable=fromStock.batches.reduce((s,b)=>s+b.qty,0);if(qty>totalAvailable){showToast('Stock insuffisant','Disponible: '+totalAvailable,'❌');return}fromStock.batches.sort((a,b)=>new Date(a.expiryDate||'2099')-new Date(b.expiryDate||'2099'));let remaining=qty;for(const batch of fromStock.batches){if(remaining<=0)break;const take=Math.min(batch.qty,remaining);batch.qty-=take;remaining-=take;}fromStock.batches=fromStock.batches.filter(b=>b.qty>0);const fromResto=db.stocktampon.restaurants.find(r=>r.id===fromId);if(!db.stocktampon.mouvements)db.stocktampon.mouvements=[];const dateOp=dateVal?new Date(dateVal).toISOString():new Date().toISOString();db.stocktampon.mouvements.push({type:'SORTIE',article:article.name,qty,from:fromResto.name,to:'—',motif,date:dateOp,comment,role:isGuest()?'Invité':'Admin'});await save();closeStockTamponModal();const dateAff=new Date(dateOp).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});showToast('Sortie enregistrée',qty+' — '+fromResto.name,'📤');renderStockTampon();}

px"><span style="display:flex;align-items:center;gap:5px">${exp?`<span>${exp.icon}</span>`:'<span>📅</span>'}<span style="font-weight:600;color:#cbd5e1">${b.qty}x</span> ${b.expiryDate?new Date(b.expiryDate).toLocaleDateString('fr-FR'):'Sans date'}</span><button onclick="editLotQtyTampon(${article.id},${r.id},${b.id},${b.qty})" style="padding:2px 7px;border:1px solid rgba(255,255,255,0.15);background:rgba(255,255,255,0.08);color:#94a3b8;border-radius:5px;cursor:pointer;font-size:10px;font-weight:600">✏️</button></div>`}).join(''):'';return`<div style="background:rgba(255,255,255,0.04);padding:10px 12px;margin:6px 0;border-radius:12px;border-left:3px solid ${qty>0?pal.acc:'rgba(255,255,255,0.15)'}"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:${batchHTML?'6px':'0'}"><span style="font-size:13px;font-weight:600;color:#e2e8f0">${r.name}</span><span style="font-size:22px;font-weight:800;color:${qty>0?pal.acc:'#475569'}">${qty}</span></div>${batchHTML}</div>`}).join('');const noteVal=(article.note||'').replace(/'/g,"&#39;").replace(/"/g,"&quot;");return`<div style="background:linear-gradient(145deg,#1e293b,#0f172a);border-radius:22px;overflow:hidden;border:1px solid ${pal.border};box-shadow:0 8px 30px rgba(0,0,0,0.4);transition:all 0.3s ease" onmouseover="this.style.transform='translateY(-4px)'" onmouseout="this.style.transform='translateY(0)'"><div style="height:5px;background:${pal.g}"></div><div style="padding:20px"><div style="display:flex;align-items:center;gap:12px;margin-bottom:16px">${article.photo?`<img src="${article.photo}" style="width:52px;height:52px;object-fit:cover;border-radius:12px;border:2px solid ${pal.border}">`:`<div style="width:52px;height:52px;background:${pal.light};border-radius:12px;border:2px solid ${pal.border};display:flex;align-items:center;justify-content:center;font-size:24px">📦</div>`}<div style="flex:1"><h3 style="color:#f1f5f9;margin:0;font-size:17px;font-weight:700">${article.name}</h3><div st },50);}function renderStockTamponStats(){const el=document.getElementById('stStats');if(!el)return;const arts=db.stocktampon.articles||[];const restos=db.stocktampon.restaurants||[];const totalArts=arts.length;const totalQty=arts.reduce((s,a)=>s+restos.reduce((q,r)=>{const st=a.stocks.find(x=>x.restaurantId===r.id);return q+(st?st.batches.reduce((b,lot)=>b+lot.qty,0):0)},0),0);const totalMouvs=(db.stocktampon.mouvements||[]).length;el.innerHTML=[{icon:'📦',label:'Articles',value:totalArts,g:'linear-gradient(135deg,#ff9f1c,#ff6b35)',sh:'rgba(255,107,53,0.3)'},{icon:'🍱',label:'Total en stock',value:totalQty,g:'linear-gradient(135deg,#4facfe,#00f2fe)',sh:'rgba(79,172,254,0.3)'},{icon:'📋',label:'Mouvements',value:totalMouvs,g:'linear-gradient(135deg,#667eea,#764ba2)',sh:'rgba(102,126,234,0.3)'}].map(s=>`<div style="background:${s.g};padding:18px 20px;border-radius:16px;color:white;box-shadow:0 6px 20px ${s.sh};display:flex;align-items:center;gap:14px"><span style="font-size:30px">${s.icon}</span><div><div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;opacity:0.8">${s.label}</div><div style="font-size:34px;font-weight:800;line-height:1.1">${s.value}</div></div></div>`).join('');}

;color:${m.role==='Invité'?'#a78bfa':'#86efac'};padding:2px 7px;border-radius:10px">${m.role}</span>`:'-'}</td></tr>`}).join('');document.getElementById("app").innerHTML=`<div style="background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);padding:30px;border-radius:24px;margin-bottom:20px;box-shadow:0 15px 40px rgba(0,0,0,0.4)"><h3 style="color:white;margin:0;font-size:24px;font-weight:800">📊 Historique Stock Tampon</h3><p style="color:rgba(255,255,255,0.5);margin:6px 0 0 0;font-size:13px">${movs.length} mouvement(s) enregistré(s)</p></div><button onclick="renderStockTampon()" style="background:rgba(255,255,255,0.1);color:#e2e8f0;border:1px solid rgba(255,255,255,0.15);padding:10px 20px;border-radius:10px;cursor:pointer;font-weight:600;font-size:14px;margin-bottom:15px">← Retour Stock Tampon</button><div style="overflow-x:auto;border-radius:16px;border:1px solid rgba(255,255,255,0.08);box-shadow:0 8px 30px rgba(0,0,0,0.3)"><table style="width:100%;border-collapse:collapse;background:linear-gradient(145deg,#1e293b,#0f172a)"><thead><tr style="background:rgba(255,255,255,0.05)"><th style="padding:14px;text-align:left;color:#64748b;font-size:11px;text-transform:uppercase;letter-spacing:0.8px;font-weight:700">Date</th><th style="padding:14px;text-align:left;color:#64748b;font-size:11px;text-transform:uppercase;letter-spacing:0.8px;font-weight:700">Type</th><th style="padding:14px;text-align:left;color:#64748b;font-size:11px;text-transform:uppercase;letter-spacing:0.8px;font-weight:700">Article</th><th style="padding:14px;text-align:left;color:#64748b;font-size:11px;text-transform:uppercase;letter-spacing:0.8px;font-weight:700">Qté</th><th style="padding:14px;text-align:left;color:#64748b;font-size:11px;text-transform:uppercase;letter-spacing:0.8px;font-weight:700">De</th><th style="padding:14px;text-align:left;color:#64748b;font-size:11px;text-transform:uppercase;letter-spacing:0.8px;font-weight:700">Vers / Motif</th><th style="padding:14px;text-align:left;color:#64748b;font-size:11px;text-transform:uppercase;letter-spacing:0.8px;font-weight:700">Commentaire</th><th style="padding:12px 10px;text-align:left;color:#64748b;font-size:11px;text-transform:uppercase;letter-spacing:0.8px;font-weight:700">Rôle</th></tr></thead><tbody>${rows||'<tr><td colspan="8" style="text-align:center;padding:40px;color:#475569">Aucun mouvement</td></tr>'}</tbody></table></div>`;}
document.addEventListener('keydown',function(e){if(e.key==='Escape'){const modals=document.querySelectorAll('.modal-overlay');if(modals.length>0){modals.forEach(m=>{if(!m.classList.contains('modal-closing')){m.classList.add('modal-closing');setTimeout(()=>m.remove(),200);}});}else{openDashboard();}}});function closeEpicerieModal(){['epiModal','batchModal','distModal'].forEach(id=>{document.getElementById(id)?.remove()});pastedImg=null}function closeStockTamponModal(){['stModal','editLotModal'].forEach(id=>{document.getElementById(id)?.remove()});pastedImg=null}

async function saveEditStockTampon(articleId){const article=db.stocktampon.articles?.find(a=>a.id===articleId);if(!article)return;const nom=(document.getElementById('stEditName')||document.getElementById('editSTNom'))?.value?.trim();const ref=(document.getElementById('stEditRef')||document.getElementById('editSTRef'))?.value?.trim()||'';if(!nom)return showToast('Nom requis','Renseignez le nom','⚠️');article.name=nom;article.ref=ref;if(pastedImg)article.photo=pastedImg;await save();document.getElementById('stModal')?.remove();document.getElementById('editSTModal')?.remove();renderStockTampon();showToast('Article modifié',nom,'✅');}function openEditStockTampon(articleId){const article=db.stocktampon.articles.find(a=>a.id===articleId);if(!article)return;pastedImg=article.photo||null;document.body.insertAdjacentHTML("beforeend",`<div class="modal-overlay" id="stModal"><div class="modal-box"><h3 style="color:#ff9f1c">✏️ Modifier: ${article.name}</h3><label style="font-size:12px;color:#666;display:block;margin-bottom:4px">Nom</label><input id="stEditName" placeholder="Nom" value="${article.name}" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;margin-bottom:10px"><label style="font-size:12px;color:#666;display:block;margin-bottom:4px">Référence</label><input id="stEditRef" placeholder="Référence (optionnel)" value="${article.ref||''}" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;margin-bottom:10px"><div id="photoZone" class="photo-zone">📷 Photo<input type="file" id="ePhoto" accept="image/*" capture="environment" hidden></div><div id="photoPreview">${article.photo?`<img src="${article.photo}" class="photo-preview">`:''}</div><br><button onclick="saveEditStockTampon(${articleId})" style="background:linear-gradient(135deg,#ff9f1c,#ffbf69);width:100%;padding:12px;font-weight:600">💾 Enregistrer</button><button onclick="closeStockTamponModal()" style="background:#6c757d;width:100%;margin-top:8px;padding:10px">Annuler</button></div></div>`);initPhotoZone()}
async function saveEditLotTampon(articleId,restoId,lotId,oldQty){const newQty=parseInt(document.getElementById('editLotQty').value);const newDate=document.getElementById('editLotDate').value||null;if(isNaN(newQty)||newQty<0){showToast('Quantité invalide','Entrez une valeur valide','❌');return;return}const article=db.stocktampon.articles.find(a=>a.id===articleId);if(!article)return;const stock=article.stocks.find(s=>s.restaurantId===restoId);if(!stock)return;const lot=stock.batches.find(b=>b.id===lotId);if(!lot)return;const resto=db.stocktampon.restaurants.find(r=>r.id===restoId);lot.qty=newQty;lot.expiryDate=newDate;if(!db.stocktampon.mouvements)db.stocktampon.mouvements=[];const diff=newQty-oldQty;if(diff!==0||lot.expiryDate!==newDate){db.stocktampon.mouvements.push({type:'CORRECTION',article:article.name,qty:diff,from:resto?resto.name:restoId,to:'-',date:new Date().toISOString(),note:`Correction lot (qté: ${oldQty}→${newQty}${newDate?' | date: '+new Date(newDate).toLocaleDateString('fr-FR'):' | date supprimée'})`});}await save();document.getElementById('editLotModal').remove();renderStockTampon();}

function getVaisselleDB(){if(!db.vaisselle)db.vaisselle={};if(!db.vaisselle.articles)db.vaisselle.articles=[];if(!db.vaisselle.restaurants)db.vaisselle.restaurants=[];if(!db.vaisselle.historique)db.vaisselle.historique=[];return db.vaisselle;}
function cleanInvalidVaisselleRestos(){const v=getVaisselleDB();const before=v.restaurants.length;v.restaurants=v.restaurants.filter(r=>r&&r.nom&&r.nom!=='undefined'&&r.nom.trim()!=='');const after=v.restaurants.length;const removed=before-after;if(removed>0){save();showToast('Nettoyage terminé',removed+' restaurant(s) invalide(s) supprimé(s)','✅');return true}return false}

vaisselleTab||'articles';openVaisselleTab(tab);}
function openVaisselleTab(tab){window._vaisselleTab=tab;const tabs=['articles','stocks','historique'];tabs.forEach(t=>{const btn=document.getElementById('vtab-'+t);if(!btn)return;if(t===tab){btn.style.background='linear-gradient(135deg,#667eea,#764ba2)';btn.style.color='#fff';btn.style.border='none'}else{btn.style.background='rgba(102,126,234,0.08)';btn.style.color='#4338ca';btn.style.border='2px solid #667eea'}});if(tab==='articles')renderVaisselleArticles();else if(tab==='stocks')renderVaisselleStocks();else if(tab==='historique')renderVaisselleHistorique();}

dding:4px 8px;border:none;background:#fee2e2;color:#dc2626;border-radius:5px;cursor:pointer;font-size:12px">🗑</button></td></tr>`).join('');container.innerHTML=`<div style="background:linear-gradient(145deg,#1e293b,#0f172a);border-radius:16px;padding:20px;border:1px solid rgba(255,255,255,0.08)"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:15px;flex-wrap:wrap;gap:10px"><h3 style="margin:0;color:#a78bfa">📋 Articles de vaisselle (${v.articles.length})</h3><button onclick="openAddVaisselleArticle()" style="background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;padding:8px 16px;border-radius:8px;cursor:pointer;font-weight:600">➕ Ajouter article</button></div>${v.articles.length===0?`<div style="text-align:center;padding:40px;color:#999"><div style="font-size:50px;margin-bottom:10px">🍽️</div><p>Aucun article référencé.</p><p style="font-size:13px">Ajoutez vos articles (assiettes, couverts, verres, etc.)</p></div>`:`<div style="background:#dbeafe;padding:12px;border-radius:8px;margin-bottom:12px;border-left:4px solid #3b82f6"><p style="margin:0;font-size:13px;color:#1e3a8a">💡 <strong>Astuce :</strong> Utilisez les boutons ⬆️⬇️ pour réorganiser l'ordre d'affichage des articles dans les stocks. L'ordre ici sera respecté dans tous les restaurants.</p></div><div style="overflow-x:auto;border-radius:10px;border:1px solid #e5e7eb"><table style="width:100%;border-collapse:collapse"><thead><tr style="background:linear-gradient(135deg,#667eea,#764ba2);color:#fff"><th style="padding:10px 12px;text-align:left;width:80px">Réf</th><th style="padding:10px 12px;text-align:left">Article</th><th style="padding:10px;text-align:center">Unité</th><th style="padding:10px;text-align:center">Ordre</th><th style="padding:10px;text-align:center">Actions</th></tr></thead><tbody>${rows}</tbody></table></div>`}</div>`;}function openAddVaisselleArticle(){window._vartPhoto=null;document.body.insertAdjacentHTML('beforeend',`<div id="vartModal" class="modal-overlay"><div class="modal-box" style="max-width:440px"><h3 style="color:#667eea;margin-bottom:15px">➕ Nouvel article</h3><label style="font-size:12px;color:#666;display:block;margin-bottom:3px">Référence (ex: ASS-001, VER-001)</label><input id="vartRef" placeholder="Référence de l'article" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;font-size:15px;margin-bottom:10px"><label style="font-size:12px;color:#666;display:block;margin-bottom:3px">Nom de l'article *</label><input id="vartNom" placeholder="Ex: Assiette plate, Verre, Fourchette..." style="width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;font-size:15px;margin-bottom:10px"><label style="font-size:12px;color:#666;display:block;margin-bottom:3px">Unité</label><select id="vartUnite" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;font-size:14px;margin-bottom:10px"><option value="pièce">pièce</option><option value="lot">lot</option><option value="boîte">boîte</option></select><label style="font-size:12px;color:#666;display:block;margin-bottom:3px">Photo (optionnel)</label><div id="vartPhotoZone" style="padding:20px;border:2px dashed #00c6ff;border-radius:8px;text-align:center;cursor:pointer;margin-bottom:12px;background:#f0f9ff;transition:all 0.3s" tabindex="0">📷 Cliquez ou Ctrl+V pour coller<input type="file" id="vartPhotoFile" accept="image/*" capture="environment" hidden></div><div id="vartPhotoPreview"></div><button onclick="saveNewVaisselleArticle()" style="background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;padding:12px;width:100%;border-radius:8px;font-weight:600;cursor:pointer;margin-bottom:8px">✅ Ajouter</button><button onclick="closeVartModal()" style="background:#6c757d;color:#fff;border:none;padding:10px;width:100%;border-radius:8px;cursor:pointer">Annuler</button></div></div>`);setupVartPhotoHandlers();}
function setupVartPhotoHandlers(){const zone=document.getElementById('vartPhotoZone');const fileInput=document.getElementById('vartPhotoFile');if(!zone||!fileInput)return;zone.onclick=()=>fileInput.click();fileInput.onchange=()=>{const f=fileInput.files[0];if(f)processVartPhoto(f)};const pasteHandler=e=>{const items=e.clipboardData?.items||[];for(let i=0;i<items.length;i++){if(items[i].type.indexOf('image')!==-1){e.preventDefault();const f=items[i].getAsFile();if(f)processVartPhoto(f);break}}};document.addEventListener('paste',pasteHandler);window._vartPasteHandler=pasteHandler;}

x;border-left:4px solid #f59e0b"><p style="margin:0;font-size:13px;color:#92400e">💡 <strong>Astuce :</strong> Les restaurants sont synchronisés avec vos sites de catégorie "Restauration". Vos restaurants actuels : ${restos.length}</p></div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px">${tabsHtml}</div><div id="vaisselle-resto-table"></div></div>`;renderVaisselleRestoTable(selRestoId);}

function renderVaisselleRestoTable(restoId){const v=getVaisselleDB();const resto=v.restaurants.find(r=>r.id===restoId);if(!resto)return;if(!resto.stocks)resto.stocks=[];if(!resto.hiddenArticles)resto.hiddenArticles=[];const container=document.getElementById('vaisselle-resto-table');if(!container)return;const visibleArticles=v.articles.filter(a=>!resto.hiddenArticles.includes(a.id));const total=resto.stocks.reduce((s,x)=>s+x.qty,0);const rows=visibleArticles.map(a=>{const stock=resto.stocks.find(s=>s.artId===a.id)||{qty:0};const qty=stock.qty||0;const photoHtml=a.photo?`<img src="${a.photo}" style="width:40px;height:40px;object-fit:cover;border-radius:6px;margin-right:8px;vertical-align:middle">`:`<div style="width:40px;height:40px;background:#e0e7ff;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;margin-right:8px;font-size:18px;vertical-align:middle">🍽️</div>`;const refBadge=a.ref?`<span style="background:#667eea;color:#fff;padding:2px 6px;border-radius:4px;font-size:10px;margin-right:6px">${a.ref}</span>`:'';return`<tr style="border-bottom:1px solid rgba(255,255,255,0.05);transition:background 0.1s" onmouseover="this.style.background='rgba(255,255,255,0.04)'" onmouseout="this.style.background='transparent'"><td style="padding:9px 14px;font-weight:500;font-size:14px;color:#e2d9f3">${photoHtml}${refBadge}${a.nom}</td><td style="padding:9px;text-align:center;color:#666;font-size:13px">${a.unite||'pièce'}</td><td style="padding:9px;text-align:center;width:130px"><div style="display:flex;align-items:center;justify-content:center;gap:6px"><button onclick="changeVaisselleQty('${restoId}','${a.id}',-1)" style="width:28px;height:28px;border-radius:50%;border:none;background:#fee2e2;color:#dc2626;font-size:16px;cursor:pointer;line-height:1">−</button><span id="vqty-${restoId}-${a.id}" style="font-weight:700;font-size:16px;min-width:32px;text-align:center">${qty}</span><button onclick="changeVaisselleQty('${restoId}','${a.id}',1)" style="width:28px;height:28px;border-radius:50%;border:none;background:#dcfce7;color:#16a34a;font-size:16px;cursor:pointer;line-height:1">+</button></div></td><td style="padding:9px;text-align:center;width:70px"><button onclick="editVaisselleQty('${restoId}','${a.id}','${a.nom}')" style="padding:4px 10px;border:none;background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff;border-radius:6px;cursor:pointer;font-size:12px">✏️</button></td></tr>`}).join('');const nbHidden=resto.hiddenArticles.length;const infoText=nbHidden>0?` (${nbHidden} masqué(s))`:'';const _sc=(db.sites||[]).find(s=>s.id===resto.siteId);const _col=_sc&&_sc.color?_sc.color:'#667eea';const _photo=_sc&&_sc.photo?`<img src="${_sc.photo}" style="width:36px;height:36px;border-radius:50%;object-fit:cover;border:2px solid ${_col};flex-shrink:0">`:'';container.innerHTML=`<div style="display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap">${_photo}<h3 style="margin:0;color:${_col}">${resto.nom}</h3><span style="background:${_col};color:#fff;padding:3px 10px;border-radius:12px;font-size:13px">${total} pièces</span><button onclick="manageVaisselleRestoArticles('${restoId}')" style="padding:4px 10px;border:none;background:linear-gradient(135deg,#3b82f6,#2563eb);color:#fff;border-radius:6px;cursor:pointer;font-size:12px;font-weight:600">👁️ Gérer articles${infoText}</button><button onclick="openRenameVaisselleResto('${restoId}')" style="padding:4px 10px;border:none;background:#e0e7ff;color:#667eea;border-radius:6px;cursor:pointer;font-size:12px">✏️ Renommer</button><button onclick="deleteVaisselleResto('${restoId}')" style="padding:4px 10px;border:none;background:#fee2e2;color:#dc2626;border-radius:6px;cursor:pointer;font-size:12px">🗑 Supprimer</button><button onclick="exportFeuilleInventaireVaisselle('${restoId}')" style="padding:4px 10px;border:none;background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff;border-radius:6px;cursor:pointer;font-size:12px;font-weight:600">📋 Feuille inventaire</button><button onclick="saisieGlobaleVaisselle('${restoId}')" style="padding:4px 10px;border:none;background:linear-gradient(135deg,#7c3aed,#a78bfa);color:#fff;border-radius:6px;cursor:pointer;font-size:12px;font-weight:600">📝 Saisie globale</button></div><div style="overflow-x:auto;border-radius:10px;border:1px solid #e5e7eb"><table style="width:100%;border-collapse:collapse"><thead><tr style="background:linear-gradient(135deg,${_col},${_col}dd);color:#fff"><th style="padding:10px 14px;text-align:left">Article</th><th style="padding:10px;text-align:center">Unité</th><th style="padding:10px;text-align:center">Quantité</th><th style="padding:10px;text-align:center">Saisir</th></tr></thead><tbody>${rows}</tbody></table></div>`;}
function saisieGlobaleVaisselle(restoId){const v=getVaisselleDB();const resto=v.restaurants.find(r=>r.id===restoId);if(!resto)return;const visibleArticles=v.articles.filter(a=>!resto.hiddenArticles||!resto.hiddenArticles.includes(a.id));if(!visibleArticles.length){showToast('Aucun article','','⚠️');return;}const rows=visibleArticles.map(a=>{const stock=resto.stocks?resto.stocks.find(s=>s.artId===a.id):null;const qty=stock?stock.qty:0;const photoHtml=a.photo?`<img src="${a.photo}" style="width:32px;height:32px;object-fit:cover;border-radius:6px;flex-shrink:0">`:`<div style="width:32px;height:32px;background:rgba(139,92,246,0.15);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0">🍽️</div>`;return`<div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.06)">${photoHtml}<div style="flex:1;font-size:13px;font-weight:600;color:#e2d9f3">${a.nom}<span style="font-size:11px;color:#6b5fa0;margin-left:6px">${a.unite||'pièce'}</span></div><input type="number" id="sg-${a.id}" value="${qty}" min="0" placeholder="0" style="width:80px;text-align:center;padding:8px;border-radius:8px;border:1px solid rgba(139,92,246,0.3);background:#0d0a1a;color:#e2d9f3;font-size:16px;font-weight:700"></div>`;}).join('');document.body.insertAdjacentHTML('beforeend',`<div id="saisieGlobaleModal" class="modal-overlay" style="backdrop-filter:blur(8px);z-index:99999"><div class="modal-box" style="max-width:480px;background:linear-gradient(145deg,#1a1333,#120e24);border:1px solid rgba(139,92,246,0.3);color:#e2d9f3;max-height:85vh;display:flex;flex-direction:column"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-shrink:0"><h3 style="margin:0;color:#a78bfa;font-size:16px">📝 Saisie globale — ${resto.nom}</h3><button onclick="document.getElementById('saisieGlobaleModal').remove()" style="background:rgba(239,68,68,0.15);color:#fca5a5;border:none;width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:16px">✕</button></div><div style="font-size:12px;color:#6b5fa0;margin-bottom:12px;flex-shrink:0">Saisir les quantités réelles comptées</div><div style="overflow-y:auto;flex:1">${rows}</div><button onclick="saveSaisieGlobaleVaisselle('${restoId}')" style="width:100%;background:linear-gradient(135deg,#7c3aed,#a78bfa);color:#fff;border:none;padding:14px;border-radius:12px;cursor:pointer;font-weight:700;font-size:15px;margin-top:16px;flex-shrink:0">✅ Enregistrer tout</button></div></div>`);}
async function saveSaisieGlobaleVaisselle(restoId){const v=getVaisselleDB();const resto=v.restaurants.find(r=>r.id===restoId);if(!resto)return;if(!resto.stocks)resto.stocks=[];v.articles.forEach(a=>{const inp=document.getElementById('sg-'+a.id);if(!inp)return;const n=parseInt(inp.value);if(isNaN(n)||n<0)return;let s=resto.stocks.find(x=>x.artId===a.id);if(!s){s={artId:a.id,qty:0};resto.stocks.push(s);}s.qty=n;});document.getElementById('saisieGlobaleModal').remove();await save();showToast('Sauvegardé','Quantités enregistrées ✅','🍽️');renderVaisselleRestoTable(restoId);}
function manageVaisselleRestoArticles(restoId){const v=getVaisselleDB();const resto=v.restaurants.find(r=>r.id===restoId);if(!resto)return;if(!resto.hiddenArticles)resto.hiddenArticles=[];const checkboxes=v.articles.map(a=>{const isHidden=resto.hiddenArticles.includes(a.id);const refLabel=a.ref?`<span style="background:#667eea;color:#fff;padding:1px 4px;border-radius:3px;font-size:10px;margin-right:4px">${a.ref}</span>`:'';return`<div style="padding:10px;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;justify-content:space-between"><label style="display:flex;align-items:center;cursor:pointer;flex:1"><input type="checkbox" id="art-${a.id}" ${!isHidden?'checked':''} style="width:20px;height:20px;margin-right:10px;cursor:pointer"><span style="font-size:14px">${refLabel}${a.nom}</span></label>${a.photo?`<img src="${a.photo}" style="width:30px;height:30px;object-fit:cover;border-radius:4px">`:`<span style="font-size:20px">🍽️</span>`}</div>`}).join('');document.body.insertAdjacentHTML('beforeend',`<div id="vartFilterModal" class="modal-overlay"><div class="modal-box" style="max-width:500px"><h3 style="color:#667eea;margin-bottom:15px">👁️ Articles visibles - ${resto.nom}</h3><p style="font-size:13px;color:#666;margin-bottom:15px">Cochez les articles que vous souhaitez voir apparaître dans ce restaurant.</p><div style="max-height:400px;overflow-y:auto;border:1px solid #e5e7eb;border-radius:8px;margin-bottom:15px">${checkboxes}</div><button onclick="saveVaisselleRestoArticles('${restoId}')" style="background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;padding:12px;width:100%;border-radius:8px;font-weight:600;cursor:pointer;margin-bottom:8px">💾 Enregistrer</button><button onclick="document.getElementById('vartFilterModal').remove()" style="background:#6c757d;color:#fff;border:none;padding:10px;width:100%;border-radius:8px;cursor:pointer">Annuler</button></div></div>`);}
function saveVaisselleRestoArticles(restoId){const v=getVaisselleDB();const resto=v.restaurants.find(r=>r.id===restoId);if(!resto)return;resto.hiddenArticles=v.articles.filter(a=>!document.getElementById(`art-${a.id}`)?.checked).map(a=>a.id);save();document.getElementById('vartFilterModal').remove();renderVaisselleRestoTable(restoId);const nbVisible=v.articles.length-resto.hiddenArticles.length;showToast('Configuration enregistrée',nbVisible+' article(s) visible(s)','✅');}
function changeVaisselleQty(restoId,artId,delta){const v=getVaisselleDB();const resto=v.restaurants.find(r=>r.id===restoId);if(!resto)return;if(!resto.stocks)resto.stocks=[];let s=resto.stocks.find(x=>x.artId===artId);if(!s){s={artId,qty:0};resto.stocks.push(s)}s.qty=Math.max(0,s.qty+delta);save();const el=document.getElementById(`vqty-${restoId}-${artId}`);if(el){el.textContent=s.qty;el.closest('tr').style.background=s.qty>0?'#f0fff4':'#fff'}const total=resto.stocks.reduce((sum,x)=>sum+(x.qty||0),0);const badge=document.querySelector(`#vaisselle-resto-table span`);if(badge)badge.textContent=total+' pièces';}
function editVaisselleQty(restoId,artId,nomArt){const v=getVaisselleDB();const resto=v.restaurants.find(r=>r.id===restoId);if(!resto)return;if(!resto.stocks)resto.stocks=[];let s=resto.stocks.find(x=>x.artId===artId);const current=s?s.qty:0;const val=prompt(`${nomArt}\nQuantité actuelle : ${current}\nNouvelle quantité :`,current);if(val===null)return;const n=parseInt(val);if(isNaN(n)||n<0){showToast('Valeur invalide','Entrez un nombre valide','⚠️');return;return}if(!s){s={artId,qty:0};resto.stocks.push(s)}s.qty=n;save();renderVaisselleRestoTable(restoId);}
function openAddVaisselleResto(){document.body.insertAdjacentHTML('beforeend',`<div id="vrestoModal" class="modal-overlay"><div class="modal-box" style="max-width:420px"><h3 style="color:#667eea;margin-bottom:15px">🍽️ Nouveau restaurant</h3><input id="vrestoName" placeholder="Nom du restaurant (ex: École Jean Jaurès)" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;font-size:15px"><br><br><button onclick="saveNewVaisselleResto()" style="background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;padding:12px;width:100%;border-radius:8px;font-weight:600;cursor:pointer;margin-bottom:8px">✅ Créer</button><button onclick="document.getElementById('vrestoModal').remove()" style="background:#6c757d;color:#fff;border:none;padding:10px;width:100%;border-radius:8px;cursor:pointer">Annuler</button></div></div>`);setTimeout(()=>document.getElementById('vrestoName').focus(),100);}
function saveNewVaisselleArticle(){const ref=document.getElementById('vartRef').value.trim();const nom=document.getElementById('vartNom').value.trim();if(!nom){showToast('Nom requis','Renseignez le nom','⚠️');return;return}const unite=document.getElementById('vartUnite').value;const v=getVaisselleDB();v.articles.push({id:'va'+Date.now(),ref,nom,unite,photo:window._vartPhoto||''});window._vartPhoto=null;if(window._vartPasteHandler){document.removeEventListener('paste',window._vartPasteHandler);window._vartPasteHandler=null}save();document.getElementById('vartModal').remove();renderVaisselleArticles();}
function openRenameVaisselleResto(restoId){const v=getVaisselleDB();const r=v.restaurants.find(x=>x.id===restoId);if(!r)return;document.body.insertAdjacentHTML('beforeend',`<div id="vrestoRenameModal" class="modal-overlay"><div class="modal-box" style="max-width:420px"><h3 style="color:#667eea;margin-bottom:15px">✏️ Renommer</h3><input id="vrestoNewName" value="${r.nom}" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;font-size:15px"><br><br><button onclick="saveRenameVaisselleResto('${restoId}')" style="background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;padding:12px;width:100%;border-radius:8px;font-weight:600;cursor:pointer;margin-bottom:8px">💾 Enregistrer</button><button onclick="document.getElementById('vrestoRenameModal').remove()" style="background:#6c757d;color:#fff;border:none;padding:10px;width:100%;border-radius:8px;cursor:pointer">Annuler</button></div></div>`);}
function saveRenameVaisselleResto(restoId){const nom=document.getElementById('vrestoNewName').value.trim();if(!nom)return;const v=getVaisselleDB();const r=v.restaurants.find(x=>x.id===restoId);if(r)r.nom=nom;save();document.getElementById('vrestoRenameModal').remove();renderVaisselleStocks();}
function deleteVaisselleResto(restoId){if(!confirm('Supprimer ce restaurant et toutes ses quantités ?'))return;const v=getVaisselleDB();const idx=v.restaurants.findIndex(r=>r.id===restoId);if(idx!==-1){v.restaurants.splice(idx,1);save();window._vaisselleRestoId=v.restaurants.length>0?v.restaurants[0].id:null;renderVaisselleStocks()}else{showToast('Introuvable','Restaurant introuvable','❌');return}}
function deleteVaisselleArticle(idx){confirmDelete('cet article',async()=>{const v=getVaisselleDB();v.articles.splice(idx,1);save();renderVaisselleArticles();});}
function exportFeuilleInventaireVaisselle(restoId){const v=getVaisselleDB();const resto=v.restaurants.find(r=>r.id===restoId);if(!resto){showToast('Introuvable','Restaurant introuvable','❌');return;}if(!v.articles||!v.articles.length){showToast('Aucun article','Ajoutez des articles au référentiel','⚠️');return;}try{const{jsPDF}=window.jspdf;if(!jsPDF){showToast('Erreur PDF','jsPDF non disponible','❌');return;}const doc=new jsPDF();if(!resto.hiddenArticles)resto.hiddenArticles=[];const visibleArticles=v.articles.filter(a=>!resto.hiddenArticles.includes(a.id));const siteInfo=(db.sites||[]).find(s=>s.id===resto.siteId);const siteColor=siteInfo&&siteInfo.color?siteInfo.color:'#667eea';const hexToRgbArr=h=>{const r=/^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(h);return r?[parseInt(r[1],16),parseInt(r[2],16),parseInt(r[3],16)]:[102,126,234]};const rgb=hexToRgbArr(siteColor);const rgbLight=[Math.min(255,rgb[0]+40),Math.min(255,rgb[1]+40),Math.min(255,rgb[2]+40)];const rgbXLight=[Math.min(255,rgb[0]+100),Math.min(255,rgb[1]+100),Math.min(255,rgb[2]+100)];let y=10;doc.setFillColor(rgb[0],rgb[1],rgb[2]);doc.rect(0,0,210,28,'F');doc.setTextColor(255,255,255);doc.setFontSize(14);doc.setFont('helvetica','bold');doc.text("FEUILLE D'INVENTAIRE VAISSELLE",105,12,{align:'center'});doc.setFontSize(11);doc.setFont('helvetica','normal');doc.text(resto.nom.toUpperCase(),105,21,{align:'center'});y=34;doc.setFontSize(9);doc.setTextColor(100,100,100);doc.setFont('helvetica','normal');doc.text('Date de comptage : ___________________________     Agent : ___________________________',14,y);y+=10;doc.setFillColor(rgbLight[0],rgbLight[1],rgbLight[2]);doc.rect(10,y,190,8,'F');doc.setTextColor(255,255,255);doc.setFontSize(9);doc.setFont('helvetica','bold');doc.text('Réf',14,y+5.5);doc.text('Article',38,y+5.5);doc.text('Unité',138,y+5.5);doc.text('Qté comptée',168,y+5.5,{align:'center'});y+=10;const addHeader=()=>{doc.setFillColor(rgbLight[0],rgbLight[1],rgbLight[2]);doc.rect(10,y,190,8,'F');do nt('helvetica','normal');doc.text('Inventaire du '+date.toLocaleDateString()+' — Mairie',105,y,{align:'center'})});const filename='inventaire_'+snap.label.replace(/[^a-z0-9]/gi,'_')+'_'+date.toISOString().slice(0,10)+'.pdf';doc.save(filename);showToast('PDF généré','Fichier téléchargé','📄')}catch(e){console.error('Erreur export PDF:',e);showToast('Erreur',''+e.message,'❌')}}

function moveVaisselleArticleUp(idx){if(idx===0)return;const v=getVaisselleDB();const temp=v.articles[idx];v.articles[idx]=v.articles[idx-1];v.articles[idx-1]=temp;save();renderVaisselleArticles();}
function moveVaisselleArticleDown(idx){const v=getVaisselleDB();if(idx>=v.articles.length-1)return;const temp=v.articles[idx];v.articles[idx]=v.articles[idx+1];v.articles[idx+1]=temp;save();renderVaisselleArticles();}

yles:{fillColor:rgb,fontSize:9,fontStyle:'bold'},styles:{fontSize:8},margin:{left:14,right:14},didParseCell:function(data){if(data.column.index===4&&data.section==='body'){const etat=data.cell.text[0];if(etat==='RUPTURE'){data.cell.styles.fillColor=[220,53,69];data.cell.styles.textColor=[255,255,255];}else if(etat==='STOCK BAS'){data.cell.styles.fillColor=[255,193,7];data.cell.styles.textColor=[0,0,0];}else{data.cell.styles.fillColor=[40,167,69];data.cell.styles.textColor=[255,255,255];}}}});yPos=doc.lastAutoTable.finalY+12});doc.save(`stock_entretien_${new Date().toISOString().slice(0,10)}.pdf`);showToast('PDF généré','Fichier téléchargé','📄');}}

function showBackupManager(){const backups=[];for(let i=0;i<localStorage.length;i++){const key=localStorage.key(i);if(key&&key.startsWith('backup_')){try{const data=JSON.parse(localStorage.getItem(key));const size=(localStorage.getItem(key).length/1024).toFixed(2);backups.push({key,date:key.replace('backup_auto_','').replace('backup_latest','Dernière'),size,data})}catch(e){}}}backups.sort((a,b)=>b.key.localeCompare(a.key));const rows=backups.map(b=>`<tr><td>${b.date}</td><td>${b.size} Ko</td><td><button onclick="restoreBackup('${b.key}')" style="background:linear-gradient(135deg,#28a745,#20c997);padding:6px 12px;margin:0 5px">🔄 Restaurer</button><button onclick="downloadBackup('${b.key}')" style="background:linear-gradient(135deg,#17a2b8,#138496);padding:6px 12px;margin:0 5px">💾 Télécharger</button><button onclick="deleteBackup('${b.key}')" style="background:#dc3545;padding:6px 12px;margin:0 5px">🗑 Supprimer</button></td></tr>`).join('');document.getElementById("app").innerHTML=`<div style="background:linear-gradient(135deg,#17a2b8,#138496);padding:30px;border-radius:24px;margin-bottom:25px"><h2 style="color:white;margin:0">🔒 Gestionnaire de Sauvegardes</h2></div><div style="background:white;padding:20px;border-radius:20px;margin-bottom:20px;box-shadow:0 10px 30px rgba(0,0,0,0.1)"><h3>📊 Informations</h3><p>💾 Sauvegarde automatique : <strong style="color:#28a745">Activée</strong> (toutes les 30 minutes)</p><p>📦 Nombre de sauvegardes : <strong>${backups.length}</strong></p><p>🕐 Dernière sauvegarde : <strong>${Math.floor((Date.now()-lastSaveTime)/60000)} min</strong></p></div><div style="background:white;padding:20px;border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,0.1)"><h3>📋 Liste des Sauvegardes</h3>${backups.length===0?'<p style="text-align:center;color:#999;padding:40px">Aucune sauvegarde automatique trouvée</p>':`<table style="width:100%"><thead><tr><th>Date</th><th>Taille</th><th>Actions</th></tr></thead><tbody>${rows}</tbody></table>`}</div><div style="margin-top:20px"><button onclick="createAutoBackup();showBackupManager()" style="background:linear-gradient(135deg,#28a745,#20c997)">💾 Créer une sauvegarde maintenant</button><button onclick="cleanOldBackups()" style="background:linear-gradient(135deg,#ffc107,#ff9800);color:#333">🧹 Nettoyer anciennes sauvegardes</button><button onclick="renderStocks()" style="background:linear-gradient(135deg,#4facfe,#00f2fe)">🏠 Retour</button></div>`}
async function restoreBackup(key){if(!confirm('🔄 Restaurer cette sauvegarde ?\n\n⚠️ Cela remplacera vos données actuelles !'))return;try{const backup=localStorage.getItem(key);db=JSON.parse(backup);await save();showToast('Sauvegarde restaurée','Données restaurées','✅');openDashboard()}catch(e){showToast('Erreur restauration',''+e.message,'❌')}}
function downloadBackup(key){try{const backup=localStorage.getItem(key);const dataBlob=new Blob([backup],{type:'application/json'});const url=URL.createObjectURL(dataBlob);const link=document.createElement('a');link.href=url;link.download=`${key}.json`;link.click();URL.revokeObjectURL(url)}catch(e){showToast('Erreur téléchargement',''+e.message,'❌')}}
function deleteBackup(key){confirmDelete('cette sauvegarde',()=>{localStorage.removeItem(key);showBackupManager();})}
function cleanOldBackups(){const cutoff=new Date();cutoff.setDate(cutoff.getDate()-30);let deleted=0;for(let i=localStorage.length-1;i>=0;i--){const key=localStorage.key(i);if(key&&key.startsWith('backup_auto_')){try{const dateStr=key.replace('backup_auto_','');const backupDate=new Date(dateStr);if(backupDate<cutoff&&key!=='backup_latest'){localStorage.removeItem(key);deleted++}}catch(e){}}}showToast('Nettoyage terminé',deleted+' sauvegarde(s) supprimée(s)','🧹');showBackupManager()}

ML('beforeend',`<div id="servConfigModal" class="modal-overlay"><div class="modal-box" style="max-width:700px"><h3 style="color:#6a11cb;margin-bottom:5px">⚙️ Configuration des restaurants</h3><p style="color:#666;font-size:13px;margin-bottom:15px">Définissez les services actifs et le nombre d'enfants par défaut pour chaque restaurant.</p><div style="overflow-x:auto;border-radius:12px;border:1px solid #e5e7eb"><table style="width:100%;border-collapse:collapse"><thead><tr style="background:#f5f3ff"><th style="padding:12px 14px;text-align:left;color:#6a11cb">Restaurant</th><th style="padding:12px;text-align:left;color:#6a11cb">Services configurés</th><th style="padding:12px;text-align:center;color:#6a11cb">Action</th></tr></thead><tbody>${rows}</tbody></table></div><button onclick="document.getElementById('servConfigModal').remove()" style="background:#6c757d;color:#fff;border:none;padding:11px;width:100%;border-radius:8px;cursor:pointer;margin-top:15px;font-size:14px">Fermer</button></div></div>`);}// ============ SERVIETTES - VERSION COMPLÈTE AVEC VACANCES ============

async function saveServiettesConfigResto(restoId){if(!db.serviettes)db.serviettes={annees:{},config:{}};if(!db.serviettes.config)db.serviettes.config={};const hasMidi=document.getElementById('cfgHasMidi')?.checked||false;const hasAlsh=document.getElementById('cfgHasAlsh')?.checked||false;const hasVacances=document.getElementById('cfgHasVacances')?.checked||false;const hasGouter=document.getElementById('cfgHasGouter')?.checked||false;const hasAlshGouter=document.getElementById('cfgHasAlshGouter')?.checked||false;const hasVacancesGouter=document.getElementById('cfgHasVacancesGouter')?.checked||false;db.serviettes.config[restoId]={hasMidi,hasAlsh,hasVacances,hasGouter,hasAlshGouter,hasVacancesGouter,enfantsMidi:hasMidi?parseInt(document.getElementById('cfgEnfantsMidi')?.value)||0:0,enfantsAlsh:hasAlsh?parseInt(document.getElementById('cfgEnfantsAlsh')?.value)||0:0,enfantsVacances:hasVacances?parseInt(document.getElementById('cfgEnfantsVacances')?.value)||0:0,enfantsGouter:hasGouter?parseInt(document.getElementById('cfgEnfantsGouter')?.value)||0:0,enfantsAlshGouter:hasAlshGouter?parseInt(document.getElementById('cfgEnfantsAlshGouter')?.value)||0:0,enfantsVacancesGouter:hasVacancesGouter?parseInt(document.getElementById('cfgEnfantsVacancesGouter')?.value)||0:0};await save();document.getElementById('servRestoModal').remove();showToast('Configuration enregistrée','Paramètres sauvegardés','✅');openServiettesConfig();}
async function saveServData(annee,restoId,moisIdx,champ,valeur){if(!db.serviettes)db.serviettes={annees:{},config:{}};if(!db.serviettes.annees[annee])db.serviettes.annees[annee]={};if(!db.serviettes.annees[annee][restoId])db.serviettes.annees[annee][restoId]={};if(!db.serviettes.annees[annee][restoId][moisIdx])db.serviettes.annees[annee][restoId][moisIdx]={};db.serviettes.annees[annee][restoId][moisIdx][champ]=parseInt(valeur)||0;await save();renderServiettesTableau();}
function renderServiettes(){if(!db.serviettes)db.serviettes={annees:{},config:{}};if(!db.serviettes.annees)db.serviettes.annees={};if(!db.serviettes.config)db.serviettes.config={};const restaurants=db.sites.filter(s=>s.category==='restauration');const anneeActuelle=new Date().getFullYear();document.getElementById("app").innerHTML=`<div style="background:linear-gradient(135deg,#6a11cb,#2575fc);padding:30px;border-radius:24px;margin-bottom:25px;box-shadow:0 15px 40px rgba(106,17,203,0.4)"><h2 style="color:white;margin:0;font-size:32px">🧻 Besoins en Serviettes</h2><p style="color:rgba(255,255,255,0.85);margin:8px 0 0 0;font-size:15px">Calcul mensuel par restaurant — 1 paquet = 200 serviettes</p></div><div style="background:linear-gradient(145deg,#1a1333,#120e24);border:0.5px solid rgba(139,92,246,0.2);padding:20px;border-radius:20px;margin-bottom:20px;box-shadow:0 8px 25px rgba(0,0,0,0.1);display:flex;align-items:center;gap:15px;flex-wrap:wrap"><label style="font-weight:700;color:#333;font-size:16px">📅 Année :</label><select id="servAnnee" onchange="renderServiettesTableau()" style="padding:10px 18px;border-radius:12px;border:2px solid #6a11cb;font-size:16px;font-weight:600;color:#a78bfa;background:#1a1333">${[anneeActuelle+1,anneeActuelle,anneeActuelle-1].map(y=>`<option value="${y}" ${y===anneeActuelle?'selected':''}>${y}</option>`).join('')}</select><button onclick="openServiettesConfig()" style="background:linear-gradient(135deg,#f093fb,#f5576c);margin-left:auto">⚙️ Configurer les restaurants</button><button onclick="exportServiettesRecap()" style="background:linear-gradient(135deg,#17a2b8,#138496)">📄 Export PDF récap annuel</button><button onclick="exportServiettesRecapMensuel()" style="background:linear-gradient(135deg,#f59e0b,#d97706)">📅 Export PDF mensuel</button><button onclick="showStocksMenu()" style="background:#6c757d">📦 Retour</button><button onclick="ouvrirCommandeServ()" style="background:linear-gradient(135deg,#10b981,#059669);color:#fff;border:none;padding:10px 20px;border-radius:8px;cursor:pointer">🛒 Planifier commande</button></div>${restaurants.length===0?`<div style="background:linear-gradient(145deg,#1a1333,#120e24);border:0.5px solid rgba(139,92,246,0.2);padding:40px;border-radius:20px;text-align:center;box-shadow:0 8px 25px rgba(0,0,0,0.1)"><div style="font-size:60px;margin-bottom:15px">🏫</div><p style="color:#666;font-size:18px">Aucun restaurant configuré.</p></div>`:`<div id="servTableauContainer"></div>`}`;if(restaurants.length>0)renderServiettesTableau()}

function shadeColor(hex,percent){let r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);r=Math.max(0,Math.min(255,r+percent));g=Math.max(0,Math.min(255,g+percent));b=Math.max(0,Math.min(255,b+percent));return'#'+[r,g,b].map(x=>x.toString(16).padStart(2,'0')).join('');}
function hexToRgbaString(hex,alpha){const r=parseInt(hex.slice(1,3),16)||0,g=parseInt(hex.slice(3,5),16)||0,b=parseInt(hex.slice(5,7),16)||0;return`rgba(${r},${g},${b},${alpha})`;}

// Authentification sécurisée SHA-256
async function hashPassword(password){
  const encoder=new TextEncoder();
  const data=encoder.encode(password+SALT);
  const hashBuffer=await crypto.subtle.digest('SHA-256',data);
  const hashArray=Array.from(new Uint8Array(hashBuffer));
  return hashArray.map(b=>b.toString(16).padStart(2,'0')).join('');
}

async function validerChangerMotDePasse(){

  const confirm2=document.getElementById('pwdConfirm').value;

  if(hashActuel!==CORRECT_HASH){showToast('Erreur','Mot de passe actuel incorrect','❌');return;}
  if(!nouveau||nouveau.length<4){showToast('Erreur','Le mot de passe doit faire au moins 4 caractères','⚠️');return;}

  const nouveauHash=await hashPassword(nouveau);
  document.getElementById('changePwdStep1Modal').remove();
  document.body.insertAdjacentHTML('beforeend',`<div id="changePwdModal" style="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);display:flex;align-items:center;justify-content:center;z-index:99999;backdrop-filter:blur(6px)"><div style="background:linear-gradient(145deg,#1a1333,#120e24);border:1px solid rgba(252,211,77,0.4);border-radius:20px;padding:28px;max-width:500px;width:90%;box-shadow:0 20px 60px rgba(0,0,0,0.5)"><div style="font-size:32px;text-align:center;margin-bottom:12px">🔑</div><h3 style="color:#fcd34d;text-align:center;margin:0 0 8px 0">Nouveau mot de passe généré</h3><p style="color:#8b7fb5;font-size:13px;text-align:center;margin:0 0 20px 0">Copie ce hash et remplace-le sur GitHub dans le fichier index.html à la ligne avec <code style="color:#a78bfa">CORRECT_HASH</code></p><div style="background:#0d0a1a;border-radius:10px;padding:14px;margin-bottom:16px;border:1px solid rgba(252,211,77,0.2)"><div style="font-size:11px;color:#6b5fa0;margin-bottom:6px">Ligne à remplacer dans index.html :</div><code style="font-size:11px;color:#fcd34d;word-break:break-all;display:block">const CORRECT_HASH='${nouveauHash}';</code></div><button onclick="navigator.clipboard.writeText(\"const CORRECT_HASH='${nouveauHash}';\").then(()=>showToast('Copié !','Colle-le dans ton fichier GitHub','✅'))" style="width:100%;background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff;border:none;padding:12px;border-radius:10px;cursor:pointer;font-weight:700;margin-bottom:8px">📋 Copier la ligne</button><button onclick="document.getElementById('changePwdModal').remove()" style="width:100%;background:rgba(255,255,255,0.05);color:#8b7fb5;border:0.5px solid #2a2440;padding:11px;border-radius:10px;cursor:pointer;font-weight:600">Fermer</button></div></div>`);

function sendPeremptionNotif(){if(!('Notification' in window)||Notification.permission!=='granted')return;const now=new Date();const soon=[];db.epicerie.articles.forEach(a=>{(a.batches||[]).forEach(b=>{if(b.expiryDate){const diff=Math.ceil((new Date(b.expiryDate)-now)/(1000*60*60*24));if(diff>=0&&diff<=3)soon.push(a.name+' ('+diff+'j)');}}); });if(soon.length>0){new Notification('⚠️ DEAS - Péremptions proches',{body:soon.join(', '),icon:'data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🥫</text></svg>'});}}


function copyDistribution(mouv){
  const art=db.entretien.articles.find(a=>a.name===mouv.article||a.id===mouv.articleId);
  if(!art){showToast('Introuvable','Article introuvable','❌');return;}
  if(art.qty<=0){showToast('Stock vide','Plus de stock disponible','⚠️');return;}
  const site=db.sites.find(s=>s.name===mouv.site);
  const siteId=site?.id||'';
  // Ouvrir la distribution rapide pré-remplie
  openDistributionRapide();
  setTimeout(()=>{
    const sel=document.getElementById('drArticle');
    if(sel){
      for(let o of sel.options){if(o.text.includes(art.name)){sel.value=o.value;sel.dispatchEvent(new Event('change'));break;}}
    }
    const siteSel=document.getElementById('drSite');
    if(siteSel&&siteId){siteSel.value=siteId;}
    const qtyInput=document.getElementById('drQty');
    if(qtyInput){qtyInput.value=Math.min(mouv.qty,art.qty);}
    showToast('Distribution copiée','Vérifiez et validez','📋');
  },200);
}


function showStatsSite(){
  const now=new Date();
  const moisActuel=now.getFullYear()+'-'+(now.getMonth()+1).toString().padStart(2,'0');
  const stats={};
  db.sites.forEach(s=>{stats[s.id]={name:s.name,total:0,modules:{}};});
  const allMouvs=[
    ...db.entretien.mouvements.filter(m=>m.type==='SORTIE').map(m=>({...m,module:'Entretien'})),
    ...(db.animation?.mouvements||[]).filter(m=>m.type==='SORTIE').map(m=>({...m,module:'Animation'})),
    ...(db.prefa?.mouvements||[]).filter(m=>m.type==='SORTIE').map(m=>({...m,module:'Préfa'})),
  ];
  allMouvs.forEach(m=>{
    const site=db.sites.find(s=>s.name===m.site);
    if(!site)return;
    if(!stats[site.id])return;
    stats[site.id].total+=m.qty||1;
    if(!stats[site.id].modules[m.module])stats[site.id].modules[m.module]=0;
    stats[site.id].modules[m.module]+=m.qty||1;
  });
  const rows=Object.values(stats).filter(s=>s.total>0).sort((a,b)=>b.total-a.total);
  const html=rows.map(s=>`<div style="padding:12px 16px;border-bottom:0.5px solid rgba(255,255,255,0.06);display:flex;align-items:center;gap:12px">
    <div style="flex:1;font-size:13px;color:#e2d9f3;font-weight:600">${s.name}</div>
    <div style="font-size:11px;color:#a78bfa">${Object.entries(s.modules).map(([k,v])=>k+': '+v).join(' · ')}</div>
    <div style="font-size:18px;font-weight:700;color:#7c3aed;min-width:40px;text-align:right">${s.total}</div>
  </div>`).join('');
  document.body.insertAdjacentHTML('beforeend',`<div class="modal-overlay" onclick="this.remove()" style="backdrop-filter:blur(6px)">
    <div class="modal-box" style="max-width:500px;max-height:80vh;overflow-y:auto" onclick="event.stopPropagation()">
      <div style="padding:20px 24px;border-bottom:0.5px solid rgba(255,255,255,0.08);display:flex;justify-content:space-between;align-items:center">
        <h3 style="margin:0;font-size:18px;color:#e2d9f3">📍 Sorties par site</h3>
        <button onclick="this.closest('.modal-overlay').remove()" style="background:rgba(239,68,68,0.15);border:none;color:#fca5a5;width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:14px">✕</button>
      </div>
      ${rows.length>0?html:'<div style="padding:30px;text-align:center;color:#6b5fa0">Aucun mouvement enregistré</div>'}
    </div>
  </div>`);
}

async function forceSyncLocalToCloud(){
  if(!confirm('☁️↑ Forcer l\'envoi Local → Cloud ?\n\nCela écrasera les données cloud avec votre version locale actuelle.'))return;
  showProgressBar('#22c55e');
  showLoad();
  try{
    await supabaseSave(db,true);
    showToast('Synchronisation réussie','Le Cloud a bien reçu et confirmé vos données ✅','☁️');
  }catch(e){
    finishProgressBar(false);
    console.error('Sync error:',e);
    showToast('Échec synchronisation',e.message||'Le Cloud n\'a pas confirmé l\'enregistrement','❌');
  }finally{hideLoad();}
}
async function forceSyncCloudToLocal(){
  if(!confirm('☁️↓ Forcer le chargement Cloud → Local ?\n\nCela remplacera vos données locales par la version cloud.'))return;
  showLoad();
  try{
    const result=await supabaseLoadWithDate();
    if(result&&result.data&&Object.keys(result.data).length>0){
      db=result.data;
      await saveDB(db);
      fixData();
      const dateStr=result.updated_at?new Date(result.updated_at).toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'?';
      showToast('Sync cloud → local','Données cloud chargées ('+dateStr+')','☁️');
      setTimeout(()=>location.reload(),1500);
    }else{
      // Un Cloud vide ne doit jamais écraser la base locale.
      showToast('Cloud vide','Aucune donnée trouvée sur le cloud : vos données locales sont conservées.','⚠️');
    }
  }catch(e){
    console.error('Cloud → Local error:',e);
    showToast('Cloud inaccessible',e.message||'Impossible de vérifier les données du cloud','❌');
  }finally{hideLoad();}
}

// On crée un alias propre pour les boutons qui appellent saveBatchQty(artId, batchId)
async function saveBatchQty(articleId, batchId){
  const article = db.epicerie.articles.find(a=>a.id===articleId);
  const batch   = article?.batches?.find(b=>b.id===batchId);
  if(!article||!batch){showToast('Introuvable','Lot ou article introuvable','❌');return;}
  const input = document.getElementById('batchQtyInput_'+batchId)
             || document.getElementById('inlineQty_'+batchId);
  const qty = input ? parseInt(input.value) : null;
  if(qty===null||isNaN(qty)||qty<0){showToast('Quantité invalide','','❌');return;}
  batch.qty = qty;
  if(batch.qty===0&&confirm('Quantité 0. Supprimer ce lot ?'))
    article.batches = article.batches.filter(b=>b.id!==batchId);
  await save();
  renderEpicerie();
  showToast('Quantité mise à jour','','✅');
}

function ouvrirCommandeServ(){var annee=new Date().getFullYear();var moisNoms=['Janvier','Fevrier','Mars','Avril','Mai','Juin','Juillet','Aout','Septembre','Octobre','Novembre','Decembre'];var anneesOpts=[annee-1,annee,annee+1,annee+2].map(function(y){return '<option value="'+y+'">'+y+'</option>';}).join('');var moisOpts=moisNoms.map(function(m,i){return '<option value="'+i+'">'+m+'</option>';}).join('');var html='';html+='<div id="cmdServOverlay" class="modal-overlay"><div class="modal-box" style="max-width:700px;display:flex;flex-direction:column;max-height:90vh;overflow:hidden">';html+='<h3 style="color:#10b981;margin-bottom:12px">Commande de serviettes</h3>';html+='<div style="display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap">';html+='<div><label style="font-size:12px">Annee debut</label><br><select id="csAnneeDe" onchange="calcCmdServ()" style="padding:8px;border-radius:8px;border:1px solid #ddd;margin-top:4px">'+anneesOpts+'</select></div>';html+='<div><label style="font-size:12px">Mois debut</label><br><select id="csDe" onchange="calcCmdServ()" style="padding:8px;border-radius:8px;border:1px solid #ddd;margin-top:4px">'+moisOpts+'</select></div>';html+='<div><label style="font-size:12px">Annee fin</label><br><select id="csAnneeA" onchange="calcCmdServ()" style="padding:8px;border-radius:8px;border:1px solid #ddd;margin-top:4px">'+anneesOpts+'</select></div>';html+='<div><label style="font-size:12px">Mois fin</label><br><select id="csA" onchange="calcCmdServ()" style="padding:8px;border-radius:8px;border:1px solid #ddd;margin-top:4px">'+moisOpts+'</select></div>';html+='</div><div id="csResultat" style="overflow-y:auto;flex:1"></div>';html+='<div style="display:flex;gap:10px;margin-top:10px;flex-shrink:0"><button onclick="exportCmdServPDF()" style="flex:1;background:linear-gradient(135deg,#10b981,#059669);color:#fff;border:none;padding:12px;border-radius:10px;cursor:pointer;font-weight:700">Exporter PDF</button><button onclick="fermerCmdServ()" style="f ettes.config[s.id])||{};var srvMidi=cfg.hasMidi?(cfg.enfantsMidi||0)*(data.joursMidi||0):0;var srvAlsh=cfg.hasAlsh?(cfg.enfantsAlsh||0)*(data.joursAlsh||0):0;var srvVacances=cfg.hasVacances?(data.enfantsVacances||0)*(data.joursVacances||0):0;var hasMidiTotal=cfg.hasMidi||cfg.hasAlsh||cfg.hasVacances;if(hasMidiTotal)sm+=Math.ceil((srvMidi+srvAlsh+srvVacances)/200);var srvGouter=cfg.hasGouter?(cfg.enfantsGouter||0)*(data.joursGouter||0):0;var srvAlshGouter=cfg.hasAlshGouter?(cfg.enfantsAlshGouter||0)*(data.joursAlshGouter||0):0;var srvVacGouter=cfg.hasVacancesGouter?(data.enfantsVacancesGouter||0)*(data.joursVacancesGouter||0):0;var hasGouterTotal=cfg.hasGouter||cfg.hasAlshGouter||cfg.hasVacancesGouter;if(hasGouterTotal)sg+=Math.ceil((srvGouter+srvAlshGouter+srvVacGouter)/200);}}}if(sm>0||sg>0){rows.push([s.name,sm+' paq',sg+' paq']);tm+=sm;tg+=sg;}});doc.autoTable({startY:28,head:[['Site','Midi','Gouter']],body:rows,foot:[['TOTAL',tm+' paq',tg+' paq']],headStyles:{fillColor:[16,185,129]}});doc.save('commande_serviettes.pdf');fermerCmdServ();}
